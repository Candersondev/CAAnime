name: Android TV APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        env:
          ANIME_API_URL: ${{ vars.ANIME_API_URL }}
        run: gradle :app:assembleDebug -PanimeApiUrl="${ANIME_API_URL:-https://example.invalid/}"
      - uses: actions/upload-artifact@v4
        with:
          name: CAAnime-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish installable APK as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.0-dev-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" app/build/outputs/apk/debug/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CAAnime development build ${GITHUB_RUN_NUMBER}" \
            --notes "Development/testing APK. Catalog and playback integration are not yet functional. Android debug-signed build; do not treat as a production release." \
            --prerelease
